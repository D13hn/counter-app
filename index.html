<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>AI</title>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="title"><h1>Counter App</h1></div>
            <div class="count"><span>0</span></div>
            <div class="btn">
                <button id="plus"><h4>+</h4></button>
                <button id="minus"><h4>-</h4></button>
                <button id="reset"><h4>Reset</h4></button>
            </div>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
